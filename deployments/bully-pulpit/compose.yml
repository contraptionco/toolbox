name: bully-pulpit-production

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

x-app: &app
  image: ${BULLY_IMAGE:?immutable image required}
  pull_policy: never
  env_file:
    - path: ${BULLY_RUNTIME_DIR:?private runtime required}/secrets/app.env
      format: raw
  environment:
    NODE_ENV: production
    APP_RUNTIME: toolbox
    APP_ENV: production
    WORKFLOW_TARGET_WORLD: '@workflow/world-postgres'
    WORKFLOW_LOCAL_BASE_URL: http://127.0.0.1:3000
    WORKFLOW_POSTGRES_WORKER_CONCURRENCY: '4'
  networks: [default, database]
  logging: *logging

services:
  migrate:
    <<: *app
    container_name: bully-pulpit-production-migrate
    restart: 'no'
    command: [sh, -c, 'corepack pnpm db:migrate && corepack pnpm workflow:bootstrap && corepack pnpm stripe:catalog:deploy']
    mem_limit: 1g

  app:
    <<: *app
    container_name: bully-pulpit-production
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 180s
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    container_name: bully-pulpit-production-proxy
    restart: unless-stopped
    entrypoint: [nginx, -g, 'daemon off;']
    ports: ['127.0.0.1:4244:8080']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, '--header=Host: www.philipithomas.com', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *logging

  scheduler:
    image: python:3.13-slim-bookworm@sha256:f0fa218d5b06f9b9235024fa061cde2cb141f726de52134471053d2d9b5324a3
    container_name: bully-pulpit-production-scheduler
    restart: unless-stopped
    user: ${BULLY_HOST_UID:?host uid required}:${BULLY_HOST_GID:?host gid required}
    command: [python3, -B, /scheduler.py]
    env_file:
      - path: ${BULLY_RUNTIME_DIR}/secrets/scheduler.env
        format: raw
    volumes:
      - ./scheduler.py:/scheduler.py:ro
      - ${BULLY_RUNTIME_DIR}/scheduler:/state
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 150s
    healthcheck:
      test: [CMD, python3, -B, /scheduler.py, --health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

networks:
  default: {}
  database:
    external: true
    name: toolbox_network
