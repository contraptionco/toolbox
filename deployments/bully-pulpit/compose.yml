name: bully-pulpit-local

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    container_name: bully-pulpit-postgres
    restart: unless-stopped
    env_file:
      - path: ${BULLY_RUNTIME_DIR:?set the private runtime directory}/secrets/postgres.env
        format: raw
    volumes:
      - ${BULLY_RUNTIME_DIR}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  app:
    image: ${BULLY_IMAGE:?set an immutable release image}
    container_name: bully-pulpit
    restart: unless-stopped
    init: true
    env_file:
      - path: ${BULLY_RUNTIME_DIR}/secrets/app.env
        format: raw
    environment:
      NODE_ENV: production
      APP_RUNTIME: toolbox
      DEPLOYMENT_ROLE: parallel
      APP_URL: https://bully-pulpit.contraption.co
      WORKFLOW_TARGET_WORLD: '@workflow/world-postgres'
      WORKFLOW_LOCAL_BASE_URL: http://127.0.0.1:3000
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: '4'
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    container_name: bully-pulpit-proxy
    restart: unless-stopped
    entrypoint: [nginx, -g, 'daemon off;']
    ports:
      - 127.0.0.1:4244:8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, '--header=Host: bully-pulpit.contraption.co', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

# The database and app have no host ports and do not join toolbox_network.
# Existing Postcard and the shared Postgres container are outside this project.
