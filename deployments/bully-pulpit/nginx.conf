# Public edge for the parallel Toolbox deployment. The Workflow worker calls
# app:3000 directly and must never use this listener for internal delivery.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    merge_slashes on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 10m;
    client_body_timeout 60s;

    map $http_upgrade $upstream_connection {
        default upgrade;
        '' '';
    }

    # Nginx has already decoded percent escapes in $uri. A remaining percent
    # or backslash could be decoded/normalized differently by the application.
    # Reject those ambiguous paths; this does not inspect query strings.
    map $uri $ambiguous_path {
        default 0;
        ~[%\\\\] 1;
    }

    upstream bully_pulpit {
        # The app's container IP changes on replacement. Keep resolving the
        # Compose service through Docker DNS without restarting active streams.
        zone bully_pulpit 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server app:3000 resolve;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        server_name bully-pulpit.contraption.co;

        # Also reject a mismatched Host in an absolute-form request target.
        if ($http_host !~* ^bully-pulpit\.contraption\.co(:443)?$) {
            return 444;
        }
        if ($ambiguous_path) {
            return 400;
        }

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Location matching uses the decoded URI with slash merging and dot
        # segment normalization. No client header may bypass this boundary.
        location ~* ^/\.well-known/workflow {
            return 403;
        }

        location / {
            proxy_pass http://bully_pulpit;
            proxy_http_version 1.1;
            proxy_set_header Host bully-pulpit.contraption.co;
            proxy_set_header X-Forwarded-Host bully-pulpit.contraption.co;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $upstream_connection;
            proxy_hide_header X-Robots-Tag;

            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            send_timeout 900s;
        }
    }
}
