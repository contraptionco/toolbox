name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Match the production host while avoiding the ARM runner capacity queue.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true
      - name: Run unit tests
        run: bundle exec ruby -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |file| require_relative file }'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser scripts
        run: |
          node --check web/public/app.js
          node --check web/public/auth.js
          node --check web/public/sw.js
      - name: Test dashboard browser behavior
        run: node --test test/dashboard_browser_test.js
      - name: Check heartbeat syntax
        run: zsh -n heartbeat.sh
      - name: Check Bully Pulpit release and scheduler guards
        run: python3 -m unittest discover -s deployments/bully-pulpit -p 'test_*.py'
